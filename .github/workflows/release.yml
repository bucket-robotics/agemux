name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: test "v$(bun -p 'require(\"./package.json\").version')" = "$GITHUB_REF_NAME"
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Execute release binary
        run: |
          test "$(./dist/agemux --version)" = "${GITHUB_REF_NAME#v}"
          ./dist/agemux --help
      - name: Package release binary
        run: |
          mkdir package
          cp dist/agemux package/agemux
          tar -C package -czf "agemux-${{ matrix.platform }}.tar.gz" agemux
      - uses: actions/upload-artifact@v4
        with:
          name: agemux-${{ matrix.platform }}
          path: agemux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: agemux-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp script/install release-assets/agemux-install
          chmod 0755 release-assets/agemux-install
          cd release-assets
          sha256sum agemux-*.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "agemux $GITHUB_REF_NAME" \
            --generate-notes \
            agemux-*.tar.gz checksums.txt agemux-install
