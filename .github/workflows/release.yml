name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Execute release application
        run: |
          test "$(bun ./dist/main.js --version)" = "${GITHUB_REF_NAME#v}"
          bun ./dist/main.js --help
      - name: Package release application
        run: script/package "${{ matrix.platform }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agemux-${{ matrix.platform }}
          path: agemux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agemux-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp script/install release-assets/agemux-install
          chmod 0755 release-assets/agemux-install
          cd release-assets
          set -- agemux-*.tar.gz
          test "$#" -eq 4
          for archive in "$@"; do
            tar -tzf "$archive" | grep -qx 'agemux/LICENSE'
            tar -tzf "$archive" | grep -qx 'agemux/THIRD_PARTY_NOTICES'
            tar -tzf "$archive" | grep -qx 'agemux/VERSION'
            tar -tzf "$archive" | grep -qx 'agemux/main.js'
          done
          sha256sum agemux-*.tar.gz agemux-install > checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "agemux $GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            agemux-*.tar.gz checksums.txt agemux-install
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
